kind = "web"
previewPath = "/"
title = "SiteShift — Schedule Recovery"
description = "A construction foreman prototype for entering a project schedule, describing labor or equipment disruptions, and reviewing mock-AI recovery recommendations with sample projects to try."
version = "1.0.0"
id = "artifacts/schedule-recovery"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21205

[services.development]
run = "pnpm --filter @workspace/schedule-recovery run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/schedule-recovery", "run", "build" ]
serve = "static"
publicDir = "artifacts/schedule-recovery/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21205"
BASE_PATH = "/"
